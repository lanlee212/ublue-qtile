# ublue-qtile power profiles: TLP auto-switches on power source change.
# Battery -> low power; AC -> performance. (power-profiles-daemon would
# CONFLICT with TLP — both manage the CPU governor — so TLP's native
# per-source knobs are used instead.)
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=low-power

[General]
# F44's sddm defaults the greeter to Wayland, where the cursor theme is
# ignored (invisible cursor). Force the X11 greeter — sessions are X11 anyway.
DisplayServer=x11

[Theme]
Current=eucalyptus-drop
# Override the vendor default (breeze_cursors — not installed, makes the
# greeter cursor invisible). Adwaita ships with the base image.
CursorTheme=Adwaita
CursorSize=24

# ublue-qtile topgrade config (system-wide; users can override in ~/.config/topgrade/topgrade.toml)
# Steps auto-detected on this image: bootc upgrade, brew, flatpak.

[misc]
# update system + brew + flatpaks; skip per-user repo scanning
disable = ["git_repos"]

[linux]
# Fedora Atomic (bootc) image: use bootc for the system update.
# Without this, topgrade falls back to `dnf upgrade`, which bootc systems
# refuse ("this bootc system is configured to be read-only").
bootc = true

[brew]
autoremove = true

[flatpak]
use_sudo = true

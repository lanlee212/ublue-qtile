# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: ublue-qtile
description: Fedora 44 image with Qtile WM + SDDM, shipping Lee's qtile config as the default

base-image: ghcr.io/ublue-os/base-main
image-version: 44

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
    install:
      packages:
        # Qtile + popup toolkit (launcher / notification history / power menu)
        - qtile
        - qtile-extras
        - python3-xcffib
        # ALSAWidget in the bar needs pyalsaaudio
        - python3-pyalsaaudio
        # Display manager
        - sddm
        # Terminal (config default: ghostty)
        - ghostty
        # Notifications
        - dunst
        - libnotify
        # Lockscreen stack (betterlockscreen script + source-built i3lock-color)
        - xautolock
        - ImageMagick
        - feh
        - bc
        - xorg-x11-utils
        - xorg-x11-server-utils
        # Autostart stack
        - picom
        - polkit-gnome
        - network-manager-applet
        - kdeconnect
        - blueman
        - remmina
        - scrot
        - pipewire-pulse
        # Browser (Mod+Shift+N via brave-origin wrapper)
        - brave-browser
        # Themes / icons / fonts
        - papirus-icon-theme
        - cantarell-fonts
        - google-noto-emoji-fonts
        # Xorg (qtile X11 backend)
        - xorg-x11-server-Xorg
        - xorg-x11-xinit
        - xorg-x11-drv-evdev
        - xorg-x11-drv-libinput
    remove:
      packages: []

  - type: script
    snippets:
      # Build i3lock-color from source (not packaged in Fedora). Pinned commit
      # abdfd4d = master as of 2026-08-14; prefix /usr (base-main's /usr/local
      # is a symlink, not a directory). Installs as /usr/bin/i3lock.
      - dnf -y install git gcc make pkgconfig autoconf automake libtool cairo-devel fontconfig-devel freetype-devel libev-devel libjpeg-turbo-devel libX11-devel libXext-devel libxcb-devel libxkbcommon-devel libxkbcommon-x11-devel pam-devel xcb-util-devel xcb-util-image-devel xcb-util-keysyms-devel xcb-util-wm-devel xcb-util-xrm-devel
      - git clone https://github.com/PandorasFox/i3lock-color /tmp/i3lock-color && cd /tmp/i3lock-color && git checkout abdfd4dd8f538c8a3f40ddd6af20a7c38438ae4c
      - cd /tmp/i3lock-color && autoreconf -i && ./configure --prefix=/usr && cd "$(ls -d /tmp/i3lock-color/*-pc-linux-gnu | head -1)" && make && make install
      # Remove build deps + source to keep the image lean
      - dnf -y remove git gcc make pkgconfig autoconf automake libtool cairo-devel fontconfig-devel freetype-devel libev-devel libjpeg-turbo-devel libX11-devel libXext-devel libxcb-devel libxkbcommon-devel libxkbcommon-x11-devel pam-devel xcb-util-devel xcb-util-image-devel xcb-util-keysyms-devel xcb-util-wm-devel xcb-util-xrm-devel && rm -rf /tmp/i3lock-color

  - type: signing

# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: ublue-qtile
description: Fedora 44 image with Qtile WM + SDDM, shipping Lee's qtile config as the default

base-image: ghcr.io/ublue-os/base-main
image-version: 44

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      copr:
        - scottames/ghostty
        - tokariew/i3lock-color
    install:
      packages:
        # Qtile + popup toolkit (launcher / notification history / power menu)
        - qtile
        - qtile-extras
        - python3-xcffib
        # Display manager
        - sddm
        # Terminal (ghostty via scottames/ghostty COPR)
        - ghostty
        # Notifications
        - dunst
        - libnotify
        # Lockscreen stack (betterlockscreen script shipped via files;
        # i3lock-color from tokariew COPR — the balamurali27 RPM's deps
        # xorg-x11-utils/server-utils were removed from F44)
        - xautolock
        - ImageMagick
        - feh
        - bc
        - xrandr
        - xset
        - i3lock-color
        # Autostart stack
        - picom
        - lxpolkit
        - network-manager-applet
        - kde-connect
        - blueman
        - remmina
        - scrot
        - pipewire-pulse
        # Browser: Brave Origin (official GitHub release zip, script module
        # below; brave-origin wrapper shipped via files). Deps from AUR pkg.
        - gtk3
        - nss
        - alsa-lib
        - libXScrnSaver
        # Themes / icons / fonts
        - papirus-icon-theme
        - abattis-cantarell-fonts
        - google-noto-emoji-fonts
        # Xorg (qtile X11 backend)
        - xorg-x11-server-Xorg
        - xorg-x11-xinit
        - xorg-x11-drv-evdev
        - xorg-x11-drv-libinput
    remove:
      packages: []

  - type: script
    snippets:
      # Brave Origin: official Linux build from brave/brave-browser GitHub
      # releases (same source the AUR brave-origin-bin uses). Extracted to
      # /opt/brave-origin-bin; the shipped /usr/bin/brave-origin wrapper execs it.
      - curl -L -o /tmp/brave-origin.zip https://github.com/brave/brave-browser/releases/download/v1.93.136/brave-origin-1.93.136-linux-amd64.zip
      - cd /tmp && python3 -m zipfile -e brave-origin.zip /tmp/bo && mkdir -p /opt/brave-origin-bin && cp -a /tmp/bo/. /opt/brave-origin-bin/ && chmod 4755 /opt/brave-origin-bin/chrome-sandbox
      # icons (mirrors the AUR package layout)
      - for s in 16 24 32 48 64 128 256; do install -Dm644 /opt/brave-origin-bin/product_logo_${s}.png /usr/share/icons/hicolor/${s}x${s}/apps/brave-origin.png; done
      # cleanup
      - rm -rf /tmp/brave-origin.zip /tmp/bo

  - type: signing

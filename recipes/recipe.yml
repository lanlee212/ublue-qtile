# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: ublue-qtile
description: Fedora 44 image with Qtile WM + SDDM, shipping Lee's qtile config as the default

base-image: ghcr.io/ublue-os/base-main
image-version: 44

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      copr:
        - scottames/ghostty
        - tokariew/i3lock-color
    install:
      packages:
        # Qtile + popup toolkit (launcher / notification history / power menu)
        - qtile
        - qtile-extras
        - python3-xcffib
        # Display manager
        - sddm
        # Terminal (ghostty via scottames/ghostty COPR)
        - ghostty
        # Notifications
        - dunst
        - libnotify
        # Lockscreen stack (betterlockscreen script shipped via files;
        # i3lock-color from tokariew COPR — the balamurali27 RPM's deps
        # xorg-x11-utils/server-utils were removed from F44)
        - xautolock
        - ImageMagick
        - feh
        - bc
        - xrandr
        - xset
        - i3lock-color
        # Autostart stack
        - picom
        - lxpolkit
        - network-manager-applet
        - kde-connect
        - blueman
        - remmina
        - scrot
        - pipewire-pulse
        # Browser: Brave Origin (official package from the Brave repo)
        - brave-origin
        # Themes / icons / fonts
        - papirus-icon-theme
        - abattis-cantarell-fonts
        - google-noto-emoji-fonts
        # Xorg (qtile X11 backend)
        - xorg-x11-server-Xorg
        - xorg-x11-xinit
        - xorg-x11-drv-evdev
        - xorg-x11-drv-libinput
    remove:
      packages: []

  - type: signing

# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: ublue-qtile
description: Fedora 44 image with Qtile WM + SDDM

base-image: ghcr.io/ublue-os/base-main
image-version: latest



modules:
  - type: files
    files:
      - source: system
        destination: /
 # STEP 1: The OGC Kernel Core Swap
  # This module tells the BlueBuild compiler to execute raw Containerfile stages.
  - type: containerfile
    snippets:
      # Inject the multi-stage build directly into the compilation pipeline
     - COPY --from=ghcr.io/ublue-os/akmods:ogc-44 /kernel-rpms/ /tmp/kernel-rpms/
      - RUN rpm-ostree override replace /tmp/kernel-rpms/kernel-[0-9]*.rpm /tmp/kernel-rpms/kernel-core-*.rpm /tmp/kernel-rpms/kernel-modules-*.rpm /tmp/kernel-rpms/kernel-modules-core-*.rpm /tmp/kernel-rpms/kernel-modules-extra-*.rpm && ostree container commit
Use code with caution.Verification of the Internal Architectureghcr.io/ublue-os/akmods: This is the official compilation cache where the system archives daily builds of pre-compiled kernel structures.ogc-44: This tells the compiler to look directly at the Open Gaming Collective kernel flavors targeted for the Fedora 44 base runtime architecture.Commit this text fix and push to your git origin branch. The cloud action pipeline runner will pull down the correct image source layer and successfully complete your build without failing.Let me know if you encounter any:ostree transaction locks while building later stagesProblems getting your graphic configurations matching the newly swapped kernel layerI am here to guide you through completing this custom build pipeline!GitHub[Bug] you can't install akmod-wl · Issue #85 · ublue-os/mainMar 22, 2023 — When I install akmod-wl on my laptop using the silverblue-main:37 image, I get the following error. It works fine on the official ...GitHubBuild OGC akmods · ublue-os/akmods@daab76e - GitHubBuild common ogc (44) / Build x86_64 Process completed with exit code 1.OneUptimeHow to Fix Docker 'Image Not Found' Errors - OneUptimeUnderstanding the ErrorStep 1: Verify Image Name and TagStep 2: Check Registry AuthenticationStep 3: Verify Registry ConnectivityS...Show all

  - type: dnf
    repos:
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      copr:
        - scottames/ghostty
        - tokariew/i3lock-color
    install:
      packages:
        # Qtile + popup toolkit (launcher / notification history / power menu)
        - qtile
        - qtile-extras
        - python3-xcffib
        # Display manager
        - sddm
        # Terminal (ghostty via scottames/ghostty COPR)
        - ghostty
        # Notifications
        - dunst
        - libnotify
        # Lockscreen stack (betterlockscreen script shipped via files;
        # i3lock-color from tokariew COPR — the balamurali27 RPM's deps
        # xorg-x11-utils/server-utils were removed from F44)
        - xautolock
        - ImageMagick
        - feh
        - bc
        - xrandr
        - xset
        - i3lock-color
        # Autostart stack
        - picom
        - lxpolkit
        - network-manager-applet
        - kde-connect
        - blueman
        - remmina
        - scrot
        - pipewire-pulse
        # Browser: Brave Origin (official package from the Brave repo)
        - brave-origin
        # Extra apps (RPM Fusion nonfree is shipped via files module: steam)
        - aisleriot
        - nemo
        - steam
        - geany
        # Themes / icons / fonts
        - papirus-icon-theme
        - abattis-cantarell-fonts
        - google-noto-emoji-fonts
        # Xorg (qtile X11 backend)
        - xorg-x11-server-Xorg
        - xorg-x11-xinit
        - xorg-x11-drv-evdev
        - xorg-x11-drv-libinput
        # Qt theming (qt6ct platform theme + OneDark color scheme, profile.d env)
        - qt5ct
        - qt6ct
        # Flatpak (ProtonPlus etc.) + git (homebrew runtime dep)
        - flatpak
        - git
        # Fira Code: the shipped ghostty config uses it as the terminal font
        - fira-code-fonts
        # TLP: laptop power management (auto-tuned; tlp.service enabled below)
        - tlp
        # Brightness keys (brightnessctl), volume mixer GUI, gaming extras
        - brightnessctl
        - pavucontrol
        - gamescope
        - mangohud
        - steam-devices
        # Flatpak theming: GTK portal backend (dark scheme for libadwaita
        # flatpaks) + dconf for the gsettings write
        - xdg-desktop-portal-gtk
        - dconf
        # Build toolchain: npm native modules (node-gyp: node-pty etc.)
        # need gcc + g++ (gcc-c++), make, and the C library headers
        # (glibc-devel) — minimal base has none of these
        - gcc
        - gcc-c++
        - make
        - glibc-devel
        # Full video codecs: base-main already ships negativo17's
        # fedora-multimedia (full libavcodec + gstreamer-bad, priority 90);
        # add the missing pieces — mpv, gstreamer VA-API + ugly, and the
        # AMD full VA-API decode driver (rpmfusion nonfree)
        - gstreamer1-plugins-ugly
        - gstreamer1-vaapi
        - mpv
        - mesa-va-drivers-freeworld
    remove:
      packages: []

  - type: script
    snippets:
      # Homebrew: prebuilt install from the ublue-os/brew image, shipped as a
      # tar; brew-setup.service extracts + chowns to uid 1000 at first boot.
      - curl -sL -o /tmp/crane.tar.gz https://github.com/google/go-containerregistry/releases/download/v0.20.3/go-containerregistry_Linux_x86_64.tar.gz && tar -xzf /tmp/crane.tar.gz -C /usr/bin crane && chmod +x /usr/bin/crane
      - crane export ghcr.io/ublue-os/brew@sha256:8f952ae54585db9f855a306ef365e13609ed7c7944b12b823ba7d5ce8e1a145b /tmp/brew-img.tar && tar -xf /tmp/brew-img.tar -C /tmp system_files/usr/share/homebrew.tar.zst && install -Dm644 /tmp/system_files/usr/share/homebrew.tar.zst /usr/share/homebrew.tar.zst
      # Topgrade: all-in-one updater (rpm-ostree + brew + flatpak), release binary
      - curl -sL -o /tmp/topgrade.tar.gz https://github.com/topgrade-rs/topgrade/releases/download/v17.9.0/topgrade-v17.9.0-x86_64-unknown-linux-gnu.tar.gz && tar -xzf /tmp/topgrade.tar.gz -C /usr/bin topgrade && chmod +x /usr/bin/topgrade
      # Flathub + ProtonPlus (flatpak repo file already shipped via files module)
      - flatpak remote-add --if-not-exists --system flathub /etc/flatpak/remotes.d/flathub.flatpakrepo && flatpak install -y --noninteractive flathub com.vysp3r.ProtonPlus
      # cleanup
      - rm -rf /tmp/crane.tar.gz /tmp/brew-img.tar /tmp/topgrade.tar.gz /tmp/system_files /usr/bin/crane

  - type: signing
